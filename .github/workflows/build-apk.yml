name: Build APK (Capacitor)

on:
  workflow_dispatch:        # 手动触发：GitHub → Actions → Build APK → Run workflow
  push:
    paths:
      - 'capacitor/android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write            # 允许创建 Release 并上传 apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
          build-root-directory: capacitor/android
          arguments: ':app:assembleDebug --no-daemon'

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag: apk-debug-${{ github.run_id }}
          name: DeepSeekVoice Debug APK (${{ github.run_id }})
          body: |
            由 GitHub Actions 云编译生成（Capacitor 网页语音版）。
            账号密码登录 DeepSeek，免 API Key。
          files: capacitor/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
