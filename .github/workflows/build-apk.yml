name: Build APK (Capacitor)

on:
  workflow_dispatch:        # 手动触发：GitHub → Actions → Build APK → Run workflow
  push:
    paths:
      - 'capacitor/android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write            # 允许创建 Release 并上传 apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
          build-root-directory: capacitor/android
          arguments: ':app:assembleDebug --no-daemon'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/*.apk

      # 在线更新源：把 APK + 版本清单 latest.json 推回仓库 main（App 检查/下载用）。
      # 只动 apk/ 目录，不在 workflow 的 push paths 里，不会递归触发构建。
      - name: Publish update manifest to repo
        if: success()
        run: |
          set -e
          VC=$(sed -n "s/.*versionCode[[:space:]]*\([0-9]*\).*/\1/p" capacitor/android/app/build.gradle | head -1)
          VN=$(sed -n "s/.*versionName[[:space:]]*'\([^']*\)'.*/\1/p" capacitor/android/app/build.gradle | head -1)
          echo "publishing v${VN} (code ${VC})"
          mkdir -p apk
          # 输出文件名已带版本（DSV-1.x.x-debug.apk），通配复制；发布名保持 app-debug.apk 稳定供 App 升级
          cp capacitor/android/app/build/outputs/apk/debug/*.apk apk/app-debug.apk
          cat > apk/latest.json <<EOF
          {
            "version_code": ${VC},
            "version_name": "${VN}",
            "notes": "DeepSeekVoice 在线更新包 v${VN}（GitHub Actions 自动发布）",
            "download_url": "https://raw.githubusercontent.com/zhangshifa/deepseek_desktop/main/apk/app-debug.apk",
            "apk": "apk/app-debug.apk",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/
          git commit -m "chore: 发布更新包 v${VN} (code ${VC})" || echo "no change to commit"
          git push origin HEAD:main

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-debug-${{ github.run_id }}
          name: DeepSeekVoice Debug APK (${{ github.run_id }})
          body: |
            由 GitHub Actions 云编译生成（Capacitor 网页语音版）。
            账号密码登录 DeepSeek，免 API Key。
          files: capacitor/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
