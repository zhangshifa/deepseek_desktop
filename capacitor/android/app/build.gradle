apply plugin: 'com.android.application'

// 消除 kotlin-stdlib(1.8.x) 与旧版 kotlin-stdlib-jdk7/jdk8 的重复类冲突
// （AGP/依赖传递会同时拉入两个版本，导致 :app:checkDebugDuplicateClasses 失败）
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'com.example.deepseekvoice'
    compileSdk 34

    // 固定签名 keystore（仓库内 app/keys/）：
    // debug=调试证书（本地测试）；release=正式自签名证书（发布包，避免"风险App/调试应用"提示）。
    // CI 与本地共用同一签名，保证覆盖安装/OTA 升级不报"签名不一致"。
    signingConfigs {
        debug {
            storeFile file('keys/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('keys/release.keystore')
            storeType 'pkcs12'
            storePassword 'deepseek2026'
            keyAlias 'deepseekvoice'
            keyPassword 'deepseek2026'
        }
    }

    defaultConfig {
        applicationId 'com.example.deepseekvoice'
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName '1.1.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8+ 默认关闭 BuildConfig 生成；开启以使用 BuildConfig.VERSION_CODE（在线更新比较版本）
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug   // 调试证书，本地测试用
        }
        release {
            signingConfig signingConfigs.release // 正式证书，发布用
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // APK 输出命名：项目简写 + 版本号 + 构建类型（如 DSV-1.0.11-debug.apk），便于区分
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "DSV-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
